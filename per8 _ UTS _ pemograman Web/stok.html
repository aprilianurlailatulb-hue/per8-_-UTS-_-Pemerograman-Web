<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Stok - Toko Buku Online</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="dashboard.html" class="brand">📚 SmartBook Store</a>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="stok.html" class="active">Katalog Stok</a>
      <a href="checkout.html">Checkout</a>
      <a href="tracking.html">Tracking DO</a>
      <a href="#" onclick="logout()" style="color: var(--danger);">Logout</a>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Daftar Katalog Stok Buku</h2>
        <button class="btn" onclick="openModal('modalTambahStok')">+ Tambah Baris Stok</button>
      </div>

      <table class="table">
        <thead>
          <tr>
            <th>Kode</th>
            <th>Judul Buku</th>
            <th>Penulis</th>
            <th>Kategori</th>
            <th>Harga</th>
            <th>Stok</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="stokTableBody">
        </tbody>
      </table>
    </div>
  </div>

  <div id="modalTambahStok" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('modalTambahStok')">&times;</span>
      <h3>Tambah Stok Buku Baru</h3>
      <form onsubmit="tambahStokBaru(event)" style="margin-top: 1rem;">
        <div class="form-group">
          <label>Judul Buku</label>
          <input type="text" id="inputJudul" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Penulis</label>
          <input type="text" id="inputPenulis" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Kategori</label>
          <input type="text" id="inputKategori" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Harga (Rp)</label>
          <input type="number" id="inputHarga" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Jumlah Stok</label>
          <input type="number" id="inputStok" class="form-control" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Simpan Ke Sistem DOM</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
  <script>
    checkAuth();
    renderStokTable();
  </script>
</body>
</html>
