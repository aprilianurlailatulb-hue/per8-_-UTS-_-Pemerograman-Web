<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Buku Online - Tugas UTS Pemrograman Web 1</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    }
                }
            }
        }
        </script>
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Toko Buku Online</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="justify-content: center; align-items: center;">

  <div class="card" style="width: 100%; max-width: 420px;">
    <h2 style="text-align: center; margin-bottom: 0.5rem;">Akses Masuk</h2>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem;">Aplikasi Pemesanan Buku Online</p>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Alamat Email</label>
        <input type="email" id="loginEmail" class="form-control" required value="aprilianurlailatulbadriyah@gmail.com">
      </div>
      <div class="form-group">
        <label>Kata Sandi</label>
        <input type="password" id="loginPass" class="form-control" required value="password123">
      </div>

      <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem;">Login</button>
      <button type="button" class="btn btn-secondary" onclick="quickFillLogin()" style="width: 100%; margin-top: 0.5rem;">Auto-Fill Email Saya</button>
    </form>

    <div style="display: flex; justify-content: space-between; margin-top: 1.5rem; font-size: 0.85rem;">
      <a href="#" onclick="openModal('modalLupaPass')" style="color: var(--primary);">Lupa Password?</a>
      <a href="#" onclick="openModal('modalDaftar')" style="color: var(--accent);">Daftar Akun Baru</a>
    </div>
  </div>

  <div id="modalLupaPass" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('modalLupaPass')">&times;</span>
      <h3>Reset Kata Sandi</h3>
      <p style="color: var(--text-muted); margin: 1rem 0;">Tautan instruksi reset password akan dikirimkan ke email Anda.</p>
      <div class="form-group">
        <input type="email" class="form-control" value="aprilianurlailatulbadriyah@gmail.com">
      </div>
      <button class="btn" style="width: 100%;" onclick="closeModal('modalLupaPass'); showToast('Tautan telah dikirim!')">Kirim Link Reset</button>
    </div>
  </div>

  <div id="modalDaftar" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('modalDaftar')">&times;</span>
      <h3>Pendaftaran Akun</h3>
      <div class="form-group" style="margin-top: 1rem;">
        <label>Nama Lengkap</label>
        <input type="text" class="form-control" value="Aprilia NurLailaTul Badriyah">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" class="form-control" value="aprilianurlailatulbadriyah@gmail.com">
      </div>
      <button class="btn" style="width: 100%;" onclick="closeModal('modalDaftar'); showToast('Pendaftaran Berhasil!')">Daftar Sekarang</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
