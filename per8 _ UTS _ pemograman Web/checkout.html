  <div class="container">
    <div class="card">
      <h2>Formulir Pemesanan & Pembayaran</h2>
      <form style="margin-top: 1.5rem;" onsubmit="event.preventDefault(); showToast('Pesanan Berhasil Diproses! No DO: DO-20261104-001');">
        <div class="form-group">
          <label>Nama Pemesan</label>
          <input type="text" class="form-control" value="Aprilia NurLailaTul Badriyah" required>
        </div>
        <div class="form-group">
          <label>Email Pemesan</label>
          <input type="email" class="form-control" value="aprilianurlailatulbadriyah@gmail.com" required>
        </div>
        <div class="form-group">
          <label>Alamat Pengiriman</label>
          <textarea class="form-control" rows="3" required>Jl. Cikarang Barat No. 45, Bekasi Regency, West Java</textarea>

        <div class="form-group">

        <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Konfirmasi & Bayar Pesanan</button>
      </form>
    </div>
